# Configuration PostgreSQL Avancée - OptiCut Pro V4

## fichier: postgresql.conf

# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION PostgreSQL AVANCÉE POUR OptiCut Pro V4
# ═══════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════
# 1. WRITE-AHEAD LOGGING (WAL) - RÉSILIENCE MAXIMALE
# ═══════════════════════════════════════════════════════════════════

# Niveau WAL: replica = WAL complet pour réplication/recovery
wal_level = replica

# Buffers WAL pour améliorer la performance
wal_buffers = 16MB

# Taille de rétention des fichiers WAL (avant archivage)
wal_keep_size = 1024MB

# Archive mode: activé pour conserver l'historique WAL
archive_mode = on

# Commande d'archivage des WALs
# Copie chaque fichier WAL vers le répertoire d'archive
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'

# Timeout pour l'archivage (300s = 5 min)
archive_timeout = 300

# Compression des WALs pour économiser de l'espace
wal_compression = on

# ═══════════════════════════════════════════════════════════════════
# 2. REPLICATION & HIGH AVAILABILITY
# ═══════════════════════════════════════════════════════════════════

# Nombre max de serveurs de réplication concurrent
max_wal_senders = 10

# Timeout pour les connexions de réplication
wal_sender_timeout = 60s

# Standby hot: permet les lectures sur le standby
hot_standby = on

# ═══════════════════════════════════════════════════════════════════
# 3. DATA INTEGRITY & CHECKSUMS
# ═══════════════════════════════════════════════════════════════════

# Checksums sur les pages: détecte la corruption disque
data_checksums = on

# Full page writes: écrit la page complète en WAL (sécurité crash)
full_page_writes = on

# ═══════════════════════════════════════════════════════════════════
# 4. PERFORMANCE TUNING
# ═══════════════════════════════════════════════════════════════════

# Buffers partagés: cache partagé PostgreSQL
# Recommandé: 25% de la RAM
shared_buffers = 512MB

# Cache effectif: cache OS anticipé
# Recommandé: 50-75% de la RAM  
effective_cache_size = 2GB

# Mémoire pour maintenance (VACUUM, ANALYZE, etc)
maintenance_work_mem = 128MB

# Ratio de completion du checkpoint avant que le next commence
checkpoint_completion_target = 0.9

# Min WAL size avant checkpoint force
min_wal_size = 1GB
max_wal_size = 4GB

# ═══════════════════════════════════════════════════════════════════
# 5. LOGGING & MONITORING
# ═══════════════════════════════════════════════════════════════════

# Active le logging collector (fichiers de log)
logging_collector = on

# Répertoire des logs
log_directory = 'pg_log'

# Format des noms de fichiers de log
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# Rotation de log toutes les 24h
log_truncate_on_rotation = on
log_rotation_age = 1d

# Archive de logs anciens (keep 7 days of backups)
log_rotation_size = 0

# Logging complet: toutes les requêtes
log_statement = 'all'

# Affiche la durée d'exécution
log_duration = on

# Log les requêtes dépassant X millisecondes (-1 = désactivé)
log_min_duration_statement = -1

# ═══════════════════════════════════════════════════════════════════
# 6. EXTENSIONS & PLUGINS
# ═══════════════════════════════════════════════════════════════════

# Extensions à charger au démarrage
shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements: tracking des performances des requêtes
track_functions = 'all'
pg_stat_statements.track = 'all'
pg_stat_statements.max = 10000

# ═══════════════════════════════════════════════════════════════════
# 7. CONNECTIONS & LIMITS
# ═══════════════════════════════════════════════════════════════════

# Nombre max de connexions simultanées
max_connections = 200

# Reserved connections pour l'admin
superuser_reserved_connections = 10

# ═══════════════════════════════════════════════════════════════════
# 8. BACKUP & RECOVERY
# ═══════════════════════════════════════════════════════════════════

# Mode recovery cible pour PITR
recovery_target_timeline = 'latest'

# Base de données pour recovery (optuel)
# restore_command = 'cp /var/lib/postgresql/wal_archive/%f "%p"'

# ═══════════════════════════════════════════════════════════════════
# NOTES IMPORTANTES
# ═══════════════════════════════════════════════════════════════════

# Cette configuration:
# ✓ Garantit zéro perte de transactions (WAL + Checksums)
# ✓ Permet la récupération à la seconde près (PITR)
# ✓ Optimise la performance pour SSDs locaux
# ✓ Assure l'intégrité des données (Full Page Writes)
# ✓ Fournit le monitoring complet des requêtes

# Pour appliquer les modifications:
# 1. Éditer ce fichier
# 2. Redémarrer PostgreSQL: sudo service postgresql restart
# 3. Vérifier l'application: SELECT name, setting FROM pg_settings WHERE name LIKE 'wal%';

# Documentation:
# https://www.postgresql.org/docs/current/runtime-config.html
