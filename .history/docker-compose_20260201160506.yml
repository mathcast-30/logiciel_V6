version: '3.8'

services:
  postgres-opticut:
    image: postgres:16-alpine
    container_name: opticut-postgres
    environment:
      POSTGRES_DB: opticut_pro
      POSTGRES_USER: opticut_user
      POSTGRES_PASSWORD: SecurePassword123!@#
      POSTGRES_INITDB_ARGS: >
        -c wal_level=replica
        -c archive_mode=on
        -c archive_command='cp %p /var/lib/postgresql/wal_archive/%f'
        -c max_wal_senders=10
        -c wal_keep_size=1024MB
        -c hot_standby=on
        -c shared_preload_libraries=pg_stat_statements
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal_archive
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    networks:
      - opticut-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opticut_user -d opticut_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  postgres-wal:
    driver: local

networks:
  opticut-network:
    driver: bridge
